<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
    </head>
    <body onload="render()">
        <header>
            <div class="content">
                <img src="./assets/icons/main_icon.png" alt="" />
            </div>
        </header>
        <main>
            <section>
                <div class="content">
                    <h1>Your personal meme album</h1>
                    <div id="gallery"></div>
                    <dialog id="img-pop-up">
                        <header>
                            <h2 id="img-title">img <title></title></h2>
                            <img
                                class="close-icon"
                                onclick="closeDialog()"
                                src="./assets/icons/close_icon.png"
                                alt=""
                            />
                        </header>
                        <img id="dialog-img" src="" alt="" />
                    </dialog>
                </div>
            </section>
        </main>
        <footer>
            <div class="content">
                <div class="footer-content">
                    <figure>
                        <img
                            class="footer-logo"
                            src="./assets/icons/footer-logo.jpg"
                            alt=""
                        />
                        <figcaption class="footer-text">
                            Memelord <br />
                            Academy
                        </figcaption>
                    </figure>
                    <figure>
                        <img
                            class="copyright"
                            src="./assets/icons/copyright.png"
                            alt=""
                        />
                        <figcaption>
                            2026 Brainrot Production Company
                        </figcaption>
                    </figure>
                </div>
            </div>
            <img class="footer-bg" src="./assets/img/footer.png" alt="" />
        </footer>
    </body>
</html>
